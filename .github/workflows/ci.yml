name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test portfolio MVP
    runs-on: ubuntu-latest

    env:
      PERSIST_DECISIONS: "false"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall -q src scripts tests

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run security scenario demo
        run: |
          python -m scripts.run_demo

      - name: Verify application
        run: |
          python -c "from src.api.main import app; print(app.title, app.version)"

      - name: Verify dashboard route
        run: |
          python -c "from src.api.main import app; assert any(getattr(route, 'path', None) == '/dashboard' for route in app.routes); print('Dashboard route: OK')"

      - name: Verify required API routes
        run: |
          python -c "from src.api.main import app; routes = {getattr(route, 'path', None) for route in app.routes}; required = {'/', '/health', '/dashboard', '/docs', '/redoc', '/v1/agents', '/v1/security/evaluate', '/v1/scenarios', '/v1/demo/run-all', '/v1/metrics'}; missing = required - routes; assert not missing, f'Missing routes: {sorted(missing)}'; print('Required API routes: OK')"
