name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python tests and scenario demo
    runs-on: ubuntu-latest

    env:
      PERSIST_DECISIONS: "false"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source
        run: |
          python -m compileall -q src scripts tests

      - name: Run pytest
        run: |
          python -m pytest -q

      - name: Run scenario demonstration
        run: |
          python -m scripts.run_demo

      - name: Verify application import
        run: |
          python -c "from src.api.main import app; print(app.title, app.version)"

      - name: Verify dashboard endpoint
        run: |
          python -c "from fastapi.testclient import TestClient; from src.api.main import app; response=TestClient(app).get('/dashboard'); assert response.status_code == 200; print('Dashboard endpoint: OK')"
